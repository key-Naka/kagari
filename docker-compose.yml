name: kagari

services:
  frontend:
    build:
      context: ./frontend
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?NUXT_PUBLIC_API_BASE is required}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-127.0.0.1:3000}:3000"
    networks:
      - edge

  backend:
    build:
      context: ./backend
      target: api
    read_only: true
    tmpfs:
      - /tmp
    environment:
      APP_PORT: "8080"
      MYSQL_DSN: ${MYSQL_DSN:?MYSQL_DSN is required}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: "0"
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SESSION_TTL: ${SESSION_TTL:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?COOKIE_DOMAIN is required}
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL:-http://docker-proxy:2375}
      HOST_METRICS_URL: ${HOST_METRICS_URL:-http://host-metrics:8090}
      STATUS_HTTP_URL: ${STATUS_HTTP_URL:-http://frontend:3000/}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      host-metrics:
        condition: service_started
      docker-proxy:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-127.0.0.1:18080}:8080"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - private

  host-metrics:
    build:
      context: ./backend
      target: host-metrics
    read_only: true
    volumes:
      - /proc:/host/proc:ro
      - /:/host-root:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

  docker-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kagari}
      MYSQL_USER: ${MYSQL_USER:-kagari}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG'
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - private

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true

volumes:
  mysql-data:
  redis-data:
